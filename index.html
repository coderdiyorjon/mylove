<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for you...</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #f2f2f2;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* Boshlang'ich oyna (Yurakcha = Play tugmasi) */
        #startOverlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
        }

        #startOverlay.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .heart-icon {
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: #d9d9d9;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #startOverlay p {
            font-size: clamp(1.1rem, 5vw, 1.8rem);
            color: #e6e6e6;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            font-weight: 300;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 25px rgba(255, 255, 255, 0.4); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Video Konteyneri */
        #videoContainer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            z-index: 50;
        }

        #videoContainer.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Video O'yinchisi: Sof (tag) yoki Iframe o'rnini egallaydi */
        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #0d0d0d;
            pointer-events: auto;
            cursor: pointer;
        }

    </style>
</head>

<body>
    <!-- 1. Boshlang'ich sahifa (Yurakcha Play oynasi) -->
    <div id="startOverlay">
        <i class="fa-solid fa-heart heart-icon"></i>
        <p>Click to start</p>
    </div>

    <!-- 2. Video qismi -->
    <div id="videoContainer">
        <!-- videoga autoloop hamda playsinline berildi (Agar Iframe kelmasa ishlaydi) -->
        <video id="mainVideo" playsinline preload="auto" loop></video>
    </div>

    <script>
        // =========================================================
        // VIDEO HAVOLASI
        // =========================================================
        const directVideoLink = "https://drive.google.com/file/d/1sK9L0U16tGbcTvkQDwHzfJwCCGhaI8u-/view?usp=sharing";

        function formatDirectLink(url) {
            if (!url) return "";
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (match) return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            if (url.includes('dropbox.com')) {
                return url.replace('dl=0', 'dl=1');
            }
            return url;
        }

        function getDriveIframeLink(url) {
            if (!url) return "";
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            // Autoplay parametri bilan uzatish (Google ba'zan ruxsat beradi ba'zan yo'q)
            if (match) return `https://drive.google.com/file/d/${match[1]}/preview?autoplay=1`;
            return url;
        }

        const startOverlay = document.getElementById('startOverlay');
        const videoContainer = document.getElementById('videoContainer');
        let mainVideo = document.getElementById('mainVideo');

        const isDriveVideo = (directVideoLink || "").includes('drive.google.com');

        if (isDriveVideo) {
            // Google Drive ekanini sezadi va Iframe-ga qaytib uning o'z pleyerini chaqiradi
            const iframe = document.createElement('iframe');
            iframe.id = "mainVideo"; // Dizayn stilini ushlab qolishi uchun xuddi shu ID beriladi
            iframe.src = getDriveIframeLink(directVideoLink);
            iframe.width = "100%";
            iframe.height = "100%";
            iframe.style.border = "none";
            iframe.allow = "autoplay; fullscreen";
            
            mainVideo.replaceWith(iframe);
            mainVideo = iframe; 
        } else {
            // Agar boshqa manbadagi sof mp4 video bo'lsa shunchaki sof tag qoladi
            mainVideo.src = formatDirectLink(directVideoLink);
        }

        // Click to Start (Yurakcha) bosilganda video boshlanishini talab qilish
        startOverlay.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            
            setTimeout(() => {
                startOverlay.style.display = 'none';
                videoContainer.classList.add('show');
                
                if (!isDriveVideo) {
                    mainVideo.muted = false;
                    const playPromise = mainVideo.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.error(e);
                        });
                    }
                } else {
                    // Iframe Google Drive bo'lganligi sababli, uning Autoplay siyosatini sirtan bosib bo'lmaydi.
                    // Shuning uchun iframe'ning o'zidagi knopkadan ijroni boshqaradilar
                }
            }, 800);
        });

        if (!isDriveVideo) {
            videoContainer.addEventListener('click', () => {
                if (mainVideo.paused) {
                    mainVideo.play().catch(e => {});
                } else {
                    mainVideo.pause();
                }
            });
        }
    </script>
</body>

</html>
